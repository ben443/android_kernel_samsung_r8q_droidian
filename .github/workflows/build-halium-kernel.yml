name: Build Halium kernel

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: halium-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      CROSS_COMPILE: aarch64-linux-gnu-
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github

    steps:
      - name: Check out kernel and Lindroid DRM
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang-14 cpio flex kmod \
            libelf-dev libssl-dev lld-14 llvm-14 python3
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      - name: Configure kernel with Halium defconfig
        run: make O=out vendor/samsung-rq8-halium_defconfig

      - name: Build kernel, device trees and modules
        run: make O=out -j"$(nproc)" Image Image.gz dtbs modules

      - name: Package modules
        run: |
          make O=out INSTALL_MOD_PATH="$RUNNER_TEMP/halium-modules" modules_install
          tar -C "$RUNNER_TEMP/halium-modules" -czf out/modules.tar.gz lib

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: halium-kernel-r8q-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
            out/.config
            out/System.map
            out/modules.tar.gz
